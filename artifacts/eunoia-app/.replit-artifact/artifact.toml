kind = "web"
previewPath = "/"
title = "EUNOIA Mental Health App"
description = "A calm, supportive mental health screening companion with onboarding, account access, wellbeing check-ins, insights, resources, and profile settings."
version = "1.0.0"
id = "artifacts/eunoia-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19093

[services.development]
run = "pnpm --filter @workspace/eunoia-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eunoia-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/eunoia-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19093"
BASE_PATH = "/"
